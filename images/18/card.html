<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duvall Christmas 2018</title>
<style>
  :root { --dur: 1.6s; --ease: cubic-bezier(.6,.05,.25,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: transparent; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; }

  /* each panel is 816 x 336; four panels tall when open */
  .stage {
    --w: min(94vw, 560px, calc((100vh - 80px) * 2.4286 / 4));
    position: relative;
    width: var(--w);
    height: calc(var(--w) * 4 / 2.4286);
    perspective: 2400px;
  }
  .panel, .hinge { transform-style: preserve-3d; }
  .root {
    position: absolute; left: 0; top: 0; width: 100%; height: 25%;
    transform-style: preserve-3d;
    transform: translateY(150%) rotateY(0deg);  /* folded: centred, front showing */
    transition: transform var(--dur) var(--ease);
    cursor: pointer;
  }
  .stage.open .root { transform: translateY(0) rotateY(180deg); }        /* open: inside showing */
  .stage.open.turned .root { transform: translateY(0) rotateY(0deg); }  /* back of the strip */

  .hinge {
    position: absolute; left: 0; top: 100%; width: 100%; height: 100%;
    transform-origin: 50% 0;
    transition: transform var(--dur) var(--ease);
  }
  /* zig-zag folds */
  .h1 { transform: rotateX(-180deg); }
  .h2 { transform: rotateX(180deg); }
  .h3 { transform: rotateX(-180deg); }
  .stage.open .hinge { transform: rotateX(0deg); }
  .stage.open .h1 { transition-delay: .15s; } .stage.open .h2 { transition-delay: .3s; } .stage.open .h3 { transition-delay: .45s; }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #fff center / cover no-repeat;
    box-shadow: 0 6px 18px rgba(22,33,59,.16);
  }
  .face.b { transform: rotateY(180deg); }
  .face::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 40%);
    opacity: 0; transition: opacity var(--dur) var(--ease);
  }
  .stage:not(.open) .hinge .face::after { opacity: 1; }
  .shadow {
    position: absolute; left: 0; top: 0; width: 100%; height: 25%;
    transform: translateY(150%);
    box-shadow: 0 16px 40px rgba(22,33,59,.28), 0 2px 6px rgba(22,33,59,.18);
    transition: height var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .stage.open .shadow { height: 100%; transform: translateY(0); }

  /* hide stacked panels while folded so they don't flicker through the front */
  .hinge .face { visibility: visible; transition: opacity var(--dur) var(--ease), visibility 0s linear 0s; }
  .stage:not(.open) .hinge .face { visibility: hidden; transition: opacity var(--dur) var(--ease), visibility 0s linear var(--dur); }

  .controls { margin-top: 16px; display: flex; gap: 10px; position: relative; z-index: 2; }
  .controls button {
    font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    color: #16213b; border: 1px solid #16213b55; background: #16213b0d;
    transition: background .2s;
  }

<body>
<canvas id="snow"></canvas>

<div class="stage" id="stage">
  <div class="root" id="card" role="button" tabindex="0" aria-label="Duvall Christmas 2018 card. Click to open.">
    <div class="face a A1" role="img" aria-label="Front: The gift of good advice from the Duvalls: During the Holidays, pay attention to what you ATE."></div>
    <div class="face b B1" role="img" aria-label="DecorATE!"></div>
    <div class="hinge h1">
      <div class="face a A2" role="img" aria-label="AnimATE and intonATE! (carolers)"></div>
      <div class="face b B2" role="img" aria-label="VegetATE and over-ATE!"></div>
      <div class="hinge h2">
        <div class="face a A3" role="img" aria-label="CelebrATE and appreciATE! Love, Renee, Margaux, Nicole, Daegen, Vivian, Elise"></div>
        <div class="face b B3" role="img" aria-label="InebriATE... but don't regurgitATE!"></div>
        <div class="hinge h3">
          <div class="face a A4" role="img" aria-label="Back: Vivian, Nicole, Margaux, Elise. Duvall Christmas 2018"></div>
          <div class="face b B4" role="img" aria-label="RejuvenATE!"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="toggle">Open card</button>
  <button id="turn">See the back</button>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const card = document.getElementById('card');
  const toggleBtn = document.getElementById('toggle');
  const turnBtn = document.getElementById('turn');
  const DUR = matchMedia('(prefers-reduced-motion: reduce)').matches ? 10 : 1600;
  let timer;

  function render() {
    const open = stage.classList.contains('open');
    const turned = stage.classList.contains('turned');
    toggleBtn.textContent = open ? 'Fold up' : 'Open card';
    turnBtn.style.display = open ? '' : 'none';
    turnBtn.textContent = turned ? 'See the inside' : 'See the back';
  }
  function open() { clearTimeout(timer); stage.classList.add('open'); render(); }
  function close() { clearTimeout(timer); stage.classList.remove('open', 'turned'); render(); }
  function toggle() { stage.classList.contains('open') ? close() : open(); }
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  toggleBtn.addEventListener('click', toggle);
  turnBtn.addEventListener('click', () => { clearTimeout(timer); stage.classList.toggle('turned'); render(); });
  render();

  // Snow
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flakes = [], W, H;
  function size() {
    const dpr = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({length: Math.round(W * H / 9000)}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2.2+.6, s: Math.random()*.6+.25, d: Math.random()*Math.PI*2 }));
  }
  function tick() {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(22,33,59,.25)'; ctx.beginPath();
    for (const f of flakes) {
      if (!reduce) { f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random()*W; } }
      ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    }
    ctx.fill();
    if (!reduce) requestAnimationFrame(tick);
  }
  addEventListener('resize', size); size(); tick();
})();
</script>
</body>
</html>

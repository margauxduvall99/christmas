<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Duvall Spin on Christmas</title>
<style>
  :root { --dur: 1.4s; --ease: cubic-bezier(.65,.05,.25,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: transparent; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; }

  /* panels are 690 x 424; open card is two panels tall */
  .stage {
    --w: min(94vw, 640px, calc((100vh - 80px) * 1.6274 / 2));
    position: relative;
    width: var(--w);
    height: calc(var(--w) * 2 / 1.6274);
    perspective: 2400px;
  }
  .book {
    position: absolute; left: 0; top: 50%; width: 100%; height: 50%;
    transform-style: preserve-3d;
    transform: translateY(-50%);                     /* closed: centred */
    transition: transform var(--dur) var(--ease);
    cursor: pointer;
  }
  .stage.open .book    { transform: translateY(0); }
  .stage.flipped .book { transform: translateY(-50%) rotateY(180deg); }

  .leaf { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform var(--dur) var(--ease); }
  .leaf.cover { transform-origin: 50% 0; transform: translateZ(1px) rotateX(0deg); }
  .stage.open .leaf.cover { transform: translateZ(1px) rotateX(180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #fff center / cover no-repeat;
    box-shadow: 0 14px 34px rgba(22,33,59,.28), 0 2px 6px rgba(22,33,59,.18);
  }
  .cover .face.b { transform: rotateX(180deg); }
  .base  .face.b { transform: rotateY(180deg); }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--dur) var(--ease); }
  .cover .face.b::after { background: linear-gradient(0deg, rgba(0,0,0,.25), transparent 18%); opacity: .5; }
  .base .face.a::after  { background: linear-gradient(180deg, rgba(0,0,0,.22), transparent 15%); }
  .stage.open .cover .face.b::after, .stage.open .base .face.a::after { opacity: 1; }

  /* keep inside pages hidden while the card is turned over */
  .cover .face.b, .base .face.a { transition: opacity var(--dur) var(--ease), visibility 0s linear calc(var(--dur) * .5); }
  .stage.flipped .cover .face.b, .stage.flipped .base .face.a { visibility: hidden; transition-delay: 0s; }
  .stage.flipped .cover .face.a { visibility: hidden; transition: visibility 0s linear calc(var(--dur) * .5); }

  .controls { margin-top: 16px; display: flex; gap: 10px; position: relative; z-index: 2; }
  .controls button {
    font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    color: #16213b; border: 1px solid #16213b55; background: #16213b0d;
    transition: background .2s;
  }
  .controls button:hover { background: #16213b1f; }

<body>
<canvas id="snow"></canvas>

<div class="stage" id="stage">
  <div class="book" id="book" role="button" tabindex="0" aria-label="Duvall Christmas card. Click to open.">
    <div class="leaf base">
      <div class="face a f-in2" role="img" aria-label="Inside: Christmas tailgate party in a church parking lot"></div>
      <div class="face b f-back" role="img" aria-label="Back: ...which may not end well. Celebrate the holidays your own way! Love, Daegen, Renee, Elise, Margaux, Nicole & Vivian"></div>
    </div>
    <div class="leaf cover">
      <div class="face a f-front" role="img" aria-label="Front: It's not that we don't understand the true meaning of Christmas..."></div>
      <div class="face b f-in1" role="img" aria-label="Inside: ...we just tend to put a Duvall spin on it..."></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="toggle">Open card</button>
  <button id="flip">See the back</button>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const book = document.getElementById('book');
  const toggleBtn = document.getElementById('toggle');
  const flipBtn = document.getElementById('flip');
  const DUR = matchMedia('(prefers-reduced-motion: reduce)').matches ? 10 : 1400;

  function render() {
    const open = stage.classList.contains('open');
    const flipped = stage.classList.contains('flipped');
    toggleBtn.textContent = open ? 'Close card' : (flipped ? 'Show front' : 'Open card');
    flipBtn.style.display = flipped ? 'none' : '';
  }
  function toggle() {
    if (stage.classList.contains('flipped')) { stage.classList.remove('flipped'); render(); return; }
    stage.classList.toggle('open'); render();
  }
  function flip() {
    const wasOpen = stage.classList.contains('open');
    stage.classList.remove('open'); render();
    setTimeout(() => { stage.classList.add('flipped'); render(); }, wasOpen ? DUR * .7 : 0);
  }
  book.addEventListener('click', toggle);
  book.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  toggleBtn.addEventListener('click', toggle);
  flipBtn.addEventListener('click', flip);
  render();

  // Snow
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flakes = [], W, H;
  function size() {
    const dpr = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({length: Math.round(W * H / 9000)}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2.2+.6, s: Math.random()*.6+.25, d: Math.random()*Math.PI*2 }));
  }
  function tick() {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(22,33,59,.25)'; ctx.beginPath();
    for (const f of flakes) {
      if (!reduce) { f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random()*W; } }
      ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    }
    ctx.fill();
    if (!reduce) requestAnimationFrame(tick);
  }
  addEventListener('resize', size); size(); tick();
})();
</script>
</body>
</html>

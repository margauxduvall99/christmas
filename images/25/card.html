<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Holidays from the Duvalls</title>
<style>
  :root { --dur: 1.4s; --ease: cubic-bezier(.65,.05,.25,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #2f3d7a 0%, #1a2150 55%, #0f1433 100%);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff;
  }
  body.transparent { background: transparent; }
  #snow { position: fixed; inset: 0; pointer-events: none; }

  .stage {
    position: relative;
    /* open spread is 2 pages wide; page ratio 720:1112 */
    width: min(94vw, calc((100vh - 70px) * 1.295));
    aspect-ratio: 1440 / 1112;
    perspective: 2600px;
  }
  .book {
    position: absolute; top: 0; left: 0;
    width: 50%; height: 100%;
    transform-style: preserve-3d;
    transform: translateX(50%);            /* closed: centred */
    transition: transform var(--dur) var(--ease);
    cursor: pointer;
  }
  .stage.open .book   { transform: translateX(100%); }      /* open: right page on right half */
  .stage.flipped .book { transform: translateX(50%) rotateY(180deg); }

  .leaf {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform var(--dur) var(--ease);
  }
  .leaf.base  { transform: translateZ(0); }
  .leaf.cover { transform: translateZ(1px) rotateY(0deg); }
  .stage.open .leaf.cover { transform: translateZ(1px) rotateY(-180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #fff center / cover no-repeat;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
  }
  .face.backside { transform: rotateY(180deg); }
  /* page-turn shading */
  .face::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    transition: opacity var(--dur) var(--ease);
  }
  .cover .face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 30%); opacity: 0; }
  .cover .face.backside::after { background: linear-gradient(270deg, rgba(0,0,0,.28), transparent 18%); opacity: .4; }
  .base .face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.22), transparent 15%); opacity: 0; }
  .stage.open .cover .face.backside::after { opacity: 1; }
  .stage.open .base .face.front::after { opacity: 1; }
  /* keep the inside pages hidden while the card is turned over */
  .cover .face.backside, .base .face.front { transition: visibility 0s linear calc(var(--dur) * .5); }
  .stage.flipped .cover .face.backside,
  .stage.flipped .base .face.front { visibility: hidden; transition-delay: 0s; }
  .stage.flipped .cover .face.front { visibility: hidden; transition: visibility 0s linear calc(var(--dur) * .5); }

  .controls { margin-top: 18px; display: flex; gap: 10px; position: relative; z-index: 2; }
  .controls button {
    font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.1); color: #fff;
    backdrop-filter: blur(4px); transition: background .2s;
  }
  .controls button:hover { background: rgba(255,255,255,.22); }
  body.transparent .controls button { color: #16213b; border-color: #16213b55; background: #16213b0d; }
  .hint { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .6; }

  @media (prefers-reduced-motion: reduce) { :root { --dur: .01s; } }
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="stage" id="stage" aria-label="Holiday card. Click to open.">
  <div class="book" id="book" role="button" tabindex="0">
    <div class="leaf base">
      <div class="face front f-inR" role="img" aria-label="Inside right: '...may it bring you Guinness and Lite! Happy Holidays. Love, Daegen, Renee, Elise, Margaux, Nicole & Vivian Duvall'"></div>
      <div class="face backside f-back" role="img" aria-label="Back of card: the family pets pulling Santa's sleigh"></div>
    </div>
    <div class="leaf cover">
      <div class="face front f-front" role="img" aria-label="Front of card: 'Do you cheer what I cheer? A bar, a bar, shining in the night...'"></div>
      <div class="face backside f-inL" role="img" aria-label="Inside left: holiday beers at the bar"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="toggle">Open card</button>
  <button id="flip">See the back</button>
</div>

<script>
(() => {
  document.body.classList.add('transparent');
  const stage = document.getElementById('stage');
  const book = document.getElementById('book');
  const toggleBtn = document.getElementById('toggle');
  const flipBtn = document.getElementById('flip');

  function render() {
    const open = stage.classList.contains('open');
    const flipped = stage.classList.contains('flipped');
    toggleBtn.textContent = open ? 'Close card' : (flipped ? 'Show front' : 'Open card');
    flipBtn.textContent = flipped ? 'Show front' : 'See the back';
    flipBtn.style.display = flipped ? 'none' : '';
  }
  function setOpen(v) { stage.classList.remove('flipped'); stage.classList.toggle('open', v); render(); }
  function toggle() {
    if (stage.classList.contains('flipped')) { stage.classList.remove('flipped'); render(); return; }
    setOpen(!stage.classList.contains('open'));
  }
  function flip() {
    const wasOpen = stage.classList.contains('open');
    stage.classList.remove('open'); render();
    setTimeout(() => { stage.classList.add('flipped'); render(); }, wasOpen ? 900 : 0);
  }
  book.addEventListener('click', toggle);
  book.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  toggleBtn.addEventListener('click', toggle);
  flipBtn.addEventListener('click', flip);
  render();


  // Snow
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flakes = [], W, H;
  function size() {
    const dpr = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 9000);
    flakes = Array.from({length: n}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2.2+.6, s: Math.random()*.6+.25, d: Math.random()*Math.PI*2 }));
  }
  const snowColor = document.body.classList.contains('transparent') ? 'rgba(22,33,59,.25)' : 'rgba(255,255,255,.8)';
  function tick() {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = snowColor; ctx.beginPath();
    for (const f of flakes) {
      if (!reduce) { f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random()*W; } }
      ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    }
    ctx.fill();
    if (!reduce) requestAnimationFrame(tick);
  }
  addEventListener('resize', size); size(); tick();
})();
</script>
</body>
</html>
